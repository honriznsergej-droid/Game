<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Monkey Propeller Jetpack</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a2234; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; touch-action: none; }
    #game-wrapper { position: relative; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; z-index: 10; }
    .hud-left { display: flex; flex-direction: column; gap: 8px; min-width: 165px; max-width: 240px; width: 45%; }
    .energy-box { background: rgba(15, 22, 36, 0.78); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 8px 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); }
    .energy-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 0.4px; margin-bottom: 5px; color: #ffe28a; }
    .energy-track { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.14); border-radius: 999px; overflow: hidden; }
    .energy-fill { height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, #ff6b35 0%, #ffb703 55%, #52b788 100%); transition: width 0.06s linear; }
    .hud-right { display: flex; gap: 8px; }
    .stat-pill { background: rgba(15, 22, 36, 0.78); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 8px 12px; text-align: right; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); }
    .stat-title { font-size: 10px; text-transform: uppercase; opacity: 0.75; letter-spacing: 0.6px; }
    .stat-value { font-size: 18px; font-weight: 800; line-height: 1.15; }
    .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(10, 15, 26, 0.55); z-index: 20; transition: opacity 0.2s ease; }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .card { width: 100%; max-width: 380px; background: rgba(20, 29, 48, 0.94); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 22px; padding: 22px 20px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45); }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #ffd166; background: rgba(255, 209, 102, 0.14); border: 1px solid rgba(255, 209, 102, 0.3); padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p.desc { font-size: 14px; line-height: 1.45; color: rgba(255, 255, 255, 0.84); margin-bottom: 16px; }
    .btn-primary { width: 100%; border: none; border-radius: 14px; padding: 14px 18px; font-size: 16px; font-weight: 800; color: #161b26; background: linear-gradient(135deg, #ffd166 0%, #f77f00 100%); cursor: pointer; box-shadow: 0 10px 24px rgba(247, 127, 0, 0.35); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn-secondary { flex: 1; border: 1px solid rgba(255, 255, 255, 0.24); border-radius: 12px; padding: 10px 10px; font-size: 12px; font-weight: 600; color: #fff; background: rgba(255, 255, 255, 0.08); cursor: pointer; }
    .sprite-status { margin-top: 8px; font-size: 11px; color: #94a3b8; }
    .final-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .final-box { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 12px; }
    .final-box .num { font-size: 22px; font-weight: 800; color: #ffd166; }
    .final-box .lbl { font-size: 11px; opacity: 0.75; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <div class="hud-left">
        <div class="energy-box">
          <div class="energy-label">
            <span>⚡ ЭНЕРГИЯ</span>
            <span id="energyText">100%</span>
          </div>
          <div class="energy-track">
            <div class="energy-fill" id="energyFill"></div>
          </div>
        </div>
      </div>

      <div class="hud-right">
        <div class="stat-pill">
          <div class="stat-title">Очки</div>
          <div class="stat-value" id="scoreVal">0</div>
        </div>
        <div class="stat-pill">
          <div class="stat-title">Рекорд</div>
          <div class="stat-value" id="bestVal">0</div>
        </div>
      </div>
    </div>

    <div class="overlay" id="startOverlay">
      <div class="card">
        <div class="badge">Telegram Mini App</div>
        <h1 id="greetingTitle">Полёт на пропеллере</h1>
        <p class="desc">
          <b>Зажми экран</b> (или пробел), чтобы раскрутить пропеллер и набрать высоту.
          <b>Отпусти</b>, чтобы плавно планировать вниз. Лови бананы 🍌!
        </p>
        <button class="btn-primary" id="startBtn">ПОЛЕТЕЛИ!</button>
        <div class="btn-row">
          <button class="btn-secondary" id="uploadSpriteBtn">Выбрать PNG</button>
          <button class="btn-secondary" id="resetSpriteBtn">Сброс на monkey.png</button>
        </div>
