<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Полёт</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #162032; font-family: Arial, sans-serif; color: #fff; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 5; }
    .box { background: rgba(12, 18, 30, 0.78); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 8px 12px; }
    .bar { width: 140px; height: 8px; background: rgba(255,255,255,0.15); border-radius: 99px; overflow: hidden; margin-top: 5px; }
    .fill { height: 100%; width: 100%; background: #ffb703; }
    .stats { display: flex; gap: 8px; }
    .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 15, 25, 0.65); padding: 16px; z-index: 10; }
    .hidden { display: none; }
    .card { width: 100%; max-width: 340px; background: #1c2840; border: 1px solid rgba(255,255,255,0.2); border-radius: 18px; padding: 20px; text-align: center; }
    .btn { width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 12px; background: #ffb703; color: #111; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn2 { width: 100%; margin-top: 8px; padding: 9px; border: 1px solid rgba(255,255,255,0.25); border-radius: 10px; background: transparent; color: #fff; font-size: 13px; cursor: pointer; }
    .info { margin-top: 8px; font-size: 12px; color: #cbd5e1; }
  </style>
</head>

  <div class="hud">
    <div class="box">

      <div class="bar"><div class="fill" id="eBar"></div></div>

    <div class="stats">
      <div class="box">Очки: <b id="sTxt">0</b></div>
      <div class="box">Рекорд: <b id="bTxt">0</b></div>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <h2>Полёт</h2>

      <button class="btn" id="playBtn">Играть</button>
      <button class="btn2" id="pickBtn">Выбрать картинку вручную</button>
      <div class="info" id="sprTxt">Спрайт: monkey.png</div>
      <input type="file" id="fileInp" accept="image/*" hidden />
    </div>
  </div>

    <div class="card">
      <h2 id="endTitle">Конец полёта</h2>
      <p class="info" id="endReason"></p>

      <button class="btn" id="againBtn">Ещё раз</button>
    </div>
  </div>
